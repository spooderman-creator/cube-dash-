<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Cube Dash</title>
<style>
:root{
  --bg:#0d0b24; --bg2:#1d1650; --text:#f4f1ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b24}}
:root[data-theme="dark"]{--bg:#0d0b24}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
canvas{width:100%;max-width:min(100vw,calc(100vh*600/340));aspect-ratio:600/340;display:block;background:var(--bg)}
</style>
</head>
<body>
<canvas id="c" width="600" height="340" aria-label="Cube Dash game"></canvas>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var W=600,H=340,S=30,GY=280,CX=110,G=0.7,JV=-12,SP=3.8;

  var LV=[
    {n:'Warm Up',d:'Easy',sp:3.8,gap:8,seq:'abcfdbeaghcf',bg:'#0d0b24',bg2:'#1d1650',cube:'#35e0ff',spike:'#ff3d8b',block:'#6a4bff'},
    {n:'Neon Rush',d:'Normal',sp:4.0,gap:8,seq:'bicfjkegheb',bg:'#071f1c',bg2:'#0d4a3f',cube:'#ffe14d',spike:'#ff6a3d',block:'#14a38b'},
    {n:'Spike Storm',d:'Hard',sp:4.3,gap:8,seq:'ibcfgjkehifb',bg:'#240a14',bg2:'#52122e',cube:'#ff9bd8',spike:'#4df0ff',block:'#a23a7a'},
    {n:'Stereo Dash',d:'Classic',sp:4.2,gap:7,seq:'abcfegbhfjkebahicfgb',bg:'#0c1b3a',bg2:'#1f5fa8',cube:'#7dff6a',spike:'#ffffff',block:'#2a7bd6'}
  ];

  var obs=[],endX=1,cur=0,sel=0,L=LV[0];
  function sp(c,r){obs.push({t:'s',x:c*S,r:r||0});}
  function bl(c,r){obs.push({t:'b',x:c*S,r:r||0});}
  var P={
    a:function(x){sp(x);return 1;},
    b:function(x){sp(x);sp(x+1);return 2;},
    c:function(x){bl(x);return 1;},
    d:function(x){bl(x);bl(x+1,0);bl(x+1,1);bl(x+2,0);bl(x+2,1);bl(x+3,0);bl(x+3,1);sp(x+6);return 7;},
    e:function(x){bl(x);bl(x+1);return 2;},
    f:function(x){sp(x);sp(x+4);return 5;},
    g:function(x){sp(x);sp(x+1);sp(x+4);sp(x+5);return 6;},
    h:function(x){bl(x);bl(x+3);sp(x+1);sp(x+2);return 4;},
    i:function(x){sp(x);sp(x+1);sp(x+2);return 3;},
    j:function(x){bl(x);sp(x+1);bl(x+2,0);bl(x+2,1);sp(x+3);bl(x+4,0);bl(x+4,1);bl(x+4,2);return 5;},
    k:function(x){sp(x);bl(x+3);sp(x+6);return 7;}
  };
  var AC=null,master=null,muted=false,mTimer=null,mStep=0,mNext=0,mLvl=-1;
  try{muted=localStorage.getItem('cube-mute')==='1';}catch(e){}
  var MU=[
    {bpm:124,root:45,tri:[0,3,7],prog:[0,-4,-2,-5],arp:[0,1,2,1,2,1,0,2],lead:'triangle'},
    {bpm:136,root:48,tri:[0,4,7],prog:[0,5,-3,-1],arp:[0,2,1,2,0,2,1,2],lead:'square'},
    {bpm:148,root:43,tri:[0,3,7],prog:[0,0,-4,-2],arp:[0,1,2,1,0,1,2,2],lead:'sawtooth'},
    {bpm:132,root:50,tri:[0,3,7],prog:[0,-2,-4,-5],arp:[2,1,0,1,2,1,0,1],lead:'square'}
  ];
  function fq(m){return 440*Math.pow(2,(m-69)/12);}
  function tone(t,f,d,type,v){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
  }
  function kick(t){
    var o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.22);
  }
  function noise(t,d,v,hp){
    var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
    for(var i=0;i<n;i++)a[i]=Math.random()*2-1;
    var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
    s.buffer=b;f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);
  }
  function sched(){
    var m=MU[mLvl];if(!m||!AC)return;
    var sd=60/m.bpm/4;
    while(mNext<AC.currentTime+0.15){
      var bar=Math.floor(mStep/16)%4,s=mStep%16,r=m.root+m.prog[bar];
      if(s%4===0)kick(mNext);
      if(s===4||s===12)noise(mNext,0.12,0.35,1500);
      if(s%2===1)noise(mNext,0.04,0.12,7000);
      if(s%2===0)tone(mNext,fq(r-12+(s%4===2?12:0)),sd*1.8,'sawtooth',0.16);
      tone(mNext,fq(r+12+m.tri[m.arp[s%8]]+(s>=8?12:0)),sd*0.9,m.lead,0.09);
      mNext+=sd;mStep++;
    }
  }
  function musicStart(i){
    try{
      var A=window.AudioContext||window.webkitAudioContext;
      if(!A)return;
      if(!AC){AC=new A();master=AC.createGain();master.connect(AC.destination);}
      if(AC.state==='suspended')AC.resume();
      master.gain.cancelScheduledValues(AC.currentTime);master.gain.setValueAtTime(muted?0:0.5,AC.currentTime);
      clearInterval(mTimer);mLvl=i;mStep=0;mNext=AC.currentTime+0.08;
      mTimer=setInterval(sched,30);
    }catch(e){}
  }
  function musicStop(){
    try{
      clearInterval(mTimer);mTimer=null;
      if(AC&&master){master.gain.cancelScheduledValues(AC.currentTime);master.gain.setValueAtTime(master.gain.value,AC.currentTime);master.gain.linearRampToValueAtTime(0.0001,AC.currentTime+0.25);}
    }catch(e){}
  }
  function toggleMute(){
    muted=!muted;
    try{localStorage.setItem('cube-mute',muted?'1':'0');}catch(e){}
    if(master)master.gain.value=muted?0:0.5;
  }
  function load(i){
    cur=i;L=LV[i];SP=L.sp;obs=[];var x=16;
    L.seq.split('').forEach(function(k,j){x+=P[k](x)+L.gap+(j%3);});
    endX=(x+6)*S;
  }
  load(0);

  var state='menu',cube,cam=0,held=false,attempt=1,deadT=0,parts=[],winT=0,best={};
  try{best=JSON.parse(localStorage.getItem('cube-best2')||'{}')||{};}catch(e){best={};}
  function saveBest(){try{localStorage.setItem('cube-best2',JSON.stringify(best));}catch(e){}}
  function reset(){cube={y:GY-S,vy:0,rot:0,on:true};cam=0;parts=[];}
  reset();
  function pct(){return Math.min(100,Math.floor(cam/endX*100));}
  function start(i){load(i);sel=i;attempt=1;reset();held=false;state='play';musicStart(i);}

  function die(){
    state='dead';deadT=0;musicStop();
    var p=pct();
    if(p>(best[cur]||0)){best[cur]=p;saveBest();}
    for(var i=0;i<16;i++)parts.push({x:CX+S/2,y:cube.y+S/2,vx:(Math.random()-.4)*8,vy:(Math.random()-.8)*8,l:40});
  }

  function update(){
    if(state==='menu')return;
    if(state==='win'){winT++;return;}
    if(state==='dead'){
      deadT++;
      parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--;});
      if(deadT>45){attempt++;reset();state='play';musicStart(cur);}
      return;
    }
    cam+=SP;
    if(held&&cube.on){cube.vy=JV;cube.on=false;}
    var prevB=cube.y+S;
    cube.vy+=G;cube.y+=cube.vy;cube.on=false;
    if(cube.y+S>=GY){cube.y=GY-S;cube.vy=0;cube.on=true;}
    var wx=cam+CX;
    for(var i=0;i<obs.length;i++){
      var o=obs[i];
      if(o.x<wx-S*2||o.x>wx+S*2)continue;
      var top=GY-(o.r+1)*S;
      if(o.t==='b'){
        if(wx+S>o.x&&wx<o.x+S){
          if(prevB<=top+1&&cube.y+S>top&&cube.vy>=0){cube.y=top-S;cube.vy=0;cube.on=true;}
          else if(cube.y+S>top+2&&cube.y<top+S){die();return;}
        }
      }else{
        var hx=o.x+10,hy=top+12,hw=10,hh=18;
        if(wx+S-4>hx&&wx+4<hx+hw&&cube.y+S-4>hy&&cube.y+4<hy+hh){die();return;}
      }
    }
    var q=Math.PI/2;
    if(!cube.on)cube.rot+=0.092;
    else{var t=Math.round(cube.rot/q)*q;cube.rot+=(t-cube.rot)*.4;}
    if(cam>=endX){state='win';winT=0;best[cur]=100;saveBest();musicStop();}
  }

  function text(s,x,y,size,al){ctx.font='800 '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=al||'center';ctx.fillText(s,x,y);}
  function bg(l){
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,l.bg);g.addColorStop(1,l.bg2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  function spike(x,top){
    ctx.fillStyle=L.spike;
    ctx.beginPath();ctx.moveTo(x,top+S);ctx.lineTo(x+S/2,top+2);ctx.lineTo(x+S,top+S);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath();ctx.moveTo(x+S/2,top+8);ctx.lineTo(x+S/2+4,top+S-4);ctx.lineTo(x+S/2-4,top+S-4);ctx.closePath();ctx.fill();
  }

  function drawMenu(){
    bg(LV[sel]);
    ctx.fillStyle='#fff';text('Cube Dash',W/2,38,32);
    ctx.globalAlpha=.7;text('Choose a level',W/2,58,13);text(muted?'Sound: off':'Sound: on',W-14,24,13,'right');ctx.globalAlpha=1;
    for(var i=0;i<LV.length;i++){
      var l=LV[i],y=76+i*60,b=best[i]||0;
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(90,y,420,52);
      if(i===sel){ctx.strokeStyle=l.cube;ctx.lineWidth=3;ctx.strokeRect(90,y,420,52);}
      ctx.fillStyle=l.cube;ctx.fillRect(110,y+11,30,30);
      ctx.fillStyle='#0d0b24';ctx.fillRect(117,y+19,4,7);ctx.fillRect(128,y+19,4,7);
      ctx.fillStyle='#fff';text(l.n,158,y+24,20,'left');
      ctx.globalAlpha=.7;text((i+1)+' \u2022 '+l.d,158,y+42,12,'left');ctx.globalAlpha=1;
      ctx.fillStyle='#fff';text(b===100?'Complete!':'Best '+b+'%',490,y+24,15,'right');
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(390,y+32,100,6);
      ctx.fillStyle=l.cube;ctx.fillRect(390,y+32,b,6);
    }
    ctx.fillStyle='#fff';ctx.globalAlpha=.55;text('Tap a level  \u2022  \u2191\u2193 + Space on keyboard',W/2,333,12);ctx.globalAlpha=1;
  }

  function drawGame(){
    bg(L);
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
    var off=-(cam*.4)%60;
    for(var x=off;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke();}
    for(var y=GY;y>0;y-=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    obs.forEach(function(o){
      var sx=o.x-cam;
      if(sx<-S||sx>W)return;
      var top=GY-(o.r+1)*S;
      if(o.t==='b'){
        ctx.fillStyle=L.block;ctx.fillRect(sx,top,S,S);
        ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.strokeRect(sx+1,top+1,S-2,S-2);
      }else spike(sx,top);
    });
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle=L.cube;ctx.fillRect(0,GY,W,3);
    var fx=endX-cam;
    if(fx<W){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(fx,0,6,GY);}
    if(state!=='dead'){
      ctx.save();ctx.translate(CX+S/2,cube.y+S/2);ctx.rotate(cube.rot);
      ctx.fillStyle=L.cube;ctx.fillRect(-S/2,-S/2,S,S);
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(-S/2+1.5,-S/2+1.5,S-3,S-3);
      ctx.fillStyle='#0d0b24';ctx.fillRect(-8,-7,5,8);ctx.fillRect(3,-7,5,8);ctx.fillRect(-8,6,16,3);
      ctx.restore();
    }
    parts.forEach(function(p){if(p.l>0){ctx.fillStyle=L.cube;ctx.fillRect(p.x,p.y,8,8);}});
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(100,14,W-200,8);
    ctx.fillStyle=L.cube;ctx.fillRect(100,14,(W-200)*Math.min(1,cam/endX),8);
    ctx.fillStyle='#fff';text(pct()+'%',W/2,44,18);
    ctx.globalAlpha=.7;text('\u2039 Menu',14,24,14,'left');text('Attempt '+attempt,W-14,24,14,'right');ctx.globalAlpha=1;
    if(state==='win'){
      ctx.fillStyle='rgba(13,11,36,.7)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';text('Level complete',W/2,140,44);
      text(L.n+' \u2022 '+attempt+(attempt===1?' attempt':' attempts'),W/2,172,18);
      if(winT>30)text('Tap for menu',W/2,204,16);
    }
    if(state==='dead'&&deadT<8){ctx.fillStyle='rgba(255,61,139,'+(0.3-deadT*.035)+')';ctx.fillRect(0,0,W,H);}
  }

  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
  function press(e){
    var pt=e?pos(e):null;
    if(state==='menu'){
      if(!pt){start(sel);return;}if(pt.x>480&&pt.y<40){toggleMute();return;}
      for(var i=0;i<LV.length;i++){var y=76+i*60;if(pt.x>90&&pt.x<510&&pt.y>y&&pt.y<y+52){start(i);return;}}
      return;
    }
    if(pt&&pt.x<90&&pt.y<40){state='menu';held=false;parts=[];musicStop();return;}
    if(state==='win'){if(winT>30){state='menu';}return;}
    held=true;
  }
  function release(){held=false;}

  var last=0,acc=0,STEP=1000/60;
  function loop(t){
    acc+=Math.min(100,t-last);last=t;
    while(acc>=STEP){update();acc-=STEP;}
    if(state==='menu')drawMenu();else drawGame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function(t){last=t;loop(t);});

  document.addEventListener('keydown',function(e){
    var c=e.code;if(c==='KeyM'){toggleMute();return;}
    if(c==='Escape'){state='menu';held=false;musicStop();return;}
    if(state==='menu'){
      if(c==='ArrowUp'){sel=(sel+LV.length-1)%LV.length;e.preventDefault();}
      else if(c==='ArrowDown'){sel=(sel+1)%LV.length;e.preventDefault();}
      else if(c==='Space'||c==='Enter'){e.preventDefault();if(!e.repeat)start(sel);}
      return;
    }
    if(c==='Space'||c==='ArrowUp'){e.preventDefault();press();}
  });
  document.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp')release();});
  cv.addEventListener('pointerdown',function(e){e.preventDefault();press(e);});
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  window.addEventListener('blur',release);
})();
</script>
</body>
</html>
